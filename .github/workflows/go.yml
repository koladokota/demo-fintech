name: Go checks
on:
  push:
    branches: [master, 'refactor/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fintech?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: psql "$DATABASE_URL" -f migrations/001_initial.sql
      - run: go test ./...
      - run: go vet ./...
